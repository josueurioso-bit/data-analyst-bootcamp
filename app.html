  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================
    // Error Boundary
    // =========================================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error(`[ErrorBoundary] ${this.props.name || 'Unknown'}:`, error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="bg-red-50 border border-red-200 rounded-xl p-6 m-4 text-center">
              <h3 className="text-red-800 font-semibold mb-2">
                Something went wrong in {this.props.name || 'this section'}
              </h3>
              <p className="text-red-600 text-sm mb-4">
                {this.state.error?.message || 'An unexpected error occurred.'}
              </p>
              <button
                onClick={() => this.setState({ hasError: false, error: null })}
                className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
              >
                Try Again
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // =========================================================

    const API_URL = 'https://data-analyst-bootcamp.vercel.app';

    // =========================================================

    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzZXZpcGV0cW1sZHpnd3plYWNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NzIyMTMsImV4cCI6MjA4NTQ0ODIxM30.5r2yk2B0fLU5bwnVI9RT8dDJNcKD_r38_ElOT0G4G38';

    // =========================================================
    // Main App Component
    // =========================================================
    function App() {
      // View state: 'assessment' | 'results' | 'tutorial' | 'dashboard' | 'sprint' | 'feedback'
      // Start in tutorial if it hasn't been completed yet — auth modal overlays on top
      const [currentView, setCurrentView] = useState(
        localStorage.getItem('compadre_tutorial_done') ? 'assessment' : 'tutorial'
      );

      // Assessment state
      const [messages, setMessages] = useState([
        {
          role: 'assistant',
          content: "Hey — I'm Compadre. I'll be with you every step of the way.\n\nBefore we jump into your first sprint, I want to figure out your best starting point. This isn't a test you can fail — it's just a conversation to understand where you are right now.\n\nReady to begin?"
        }
      ]);
      const [input, setInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [assessmentResults, setAssessmentResults] = useState(null);
      const [error, setError] = useState(null);
      const [consentGiven, setConsentGiven] = useState(true);
      const messagesEndRef = useRef(null);
      const inputRef = useRef(null);
      const modalEmailRef = useRef(null);

      // Sprint state
      const [currentSprint, setCurrentSprint] = useState(null);
      const [sessionId, setSessionId] = useState(() => {
        return localStorage.getItem('compadre_session_id') || null;
      });

      // Whether user skipped the assessment (arrived via URL param)
      const [skippedAssessment, setSkippedAssessment] = useState(false);

      // Submission + Feedback state
      const [submissionFeedback, setSubmissionFeedback] = useState(null);
      const [memoText, setMemoText] = useState('');
      const [sheetsUrl, setSheetsUrl] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitError, setSubmitError] = useState(null);

      // Auth state
      const [user, setUser] = useState(null);
      const [isAnonymous, setIsAnonymous] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authError, setAuthError] = useState(null);
      const [authLoading, setAuthLoading] = useState(false);
      const [tutorialStep, setTutorialStep] = useState(0);
      // null = first-time flow; any view name = refresher (return here on close)
      const [tutorialReturnView, setTutorialReturnView] = useState(null);
      // Sprint phase: 'learn' | 'choose' | 'build' | 'publish'
      const [sprintPhase, setSprintPhase] = useState('learn');
      // =========================================================
      // LEARN phase card state (Sprint 1 interactive lesson)
      // learnCardIndex: which of the 5 cards is visible (0–4)
      // learnPick1: entry mood pick ('data'|'confused'|'new')
      // learnPick2: VP scenario pick ('A'|'B')
      // learnPick3: insight vs info pick ('A'|'B'|'C')
      // learnQC: Quick Check answers — [q1answer, q2answer]
      //   correct answers: Q1='B', Q2='C'
      // =========================================================
      const [learnCardIndex, setLearnCardIndex] = useState(0);
      const [learnPick1,     setLearnPick1]     = useState(null);
      const [learnPick2,     setLearnPick2]     = useState(null);
      const [learnPick3,     setLearnPick3]     = useState(null);
      const [learnQC,        setLearnQC]        = useState([null, null]);

      // =========================================================
      // Effects
      // =========================================================
      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => { scrollToBottom(); }, [messages]);
      useEffect(() => { inputRef.current?.focus(); }, []);

      // =========================================================
      // TEACHING MOMENT: Auth session lifecycle
      // On mount: check for an existing session (e.g. user refreshed the page).
      // onAuthStateChange: fires whenever sign-in / sign-out / token refresh happens.
      // If supabase client is null (placeholder keys), fall back to the simple
      // "show modal unless skipped" behavior so the app still works during dev.
      // =========================================================
      useEffect(() => {
        if (!supabase) {
          // Supabase not configured yet — show modal unless previously skipped
          if (!localStorage.getItem('compadre_skipped')) {
            setShowAuthModal(true);
          }
          return;
        }

        // Check for an existing session immediately
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) {
            setUser(session.user);
            setShowAuthModal(false);
            // =========================================================
            // TEACHING MOMENT: Cross-device tutorial state sync
            // localStorage only works on the same device/browser. If a
            // user completed the tutorial on their phone and signs in on
            // their laptop, localStorage has no record of it. We fix that
            // by reading tutorial_completed from their Supabase profile
            // on every page load and mirroring it to localStorage.
            // =========================================================
            supabase.from('profiles')
              .select('tutorial_completed')
              .eq('id', session.user.id)
              .single()
              .then(({ data }) => {
                if (data?.tutorial_completed) {
                  localStorage.setItem('compadre_tutorial_done', 'true');
                  setCurrentView('assessment'); // returning user on new device — skip tutorial
                }
                // If not tutorial_completed, stay in tutorial (already set by initial state)
              });
          } else if (!localStorage.getItem('compadre_skipped')) {
            setShowAuthModal(true);
          }
        });

        // Subscribe to future auth changes (sign in, sign out, token refresh)
        const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
          if (session?.user) {
            setUser(session.user);
            setShowAuthModal(false);
            // =========================================================
            // TEACHING MOMENT: Anonymous session linking
            // We only run this on SIGNED_IN — not on TOKEN_REFRESHED or
            // the initial page-load check — so we don't burn extra DB
            // calls on every mount.
            //
            // upsert = INSERT if this user has no profile yet, UPDATE if
            // they do. It's idempotent, so signing in twice is harmless.
            //
            // We only include anonymous_session_id when one exists in
            // localStorage. If the user signed in from a new device where
            // there's no session, we still create the profile row — we
            // just don't overwrite the session_id they linked previously.
            // =========================================================
            if (event === 'SIGNED_IN') {
              const storedSessionId = localStorage.getItem('compadre_session_id');
              const profileData = { id: session.user.id };
              if (storedSessionId) profileData.anonymous_session_id = storedSessionId;
              supabase.from('profiles')
                .upsert(profileData, { onConflict: 'id' })
                .then(({ error }) => {
                  if (error) console.warn('[Auth] Profile upsert failed:', error.message);
                });
              // tutorial view is already showing underneath the modal — no trigger needed
            }
          } else {
            setUser(null);
          }
        });

        // Clean up the listener when the component unmounts
        return () => subscription.unsubscribe();
      }, []);

      // Move focus into modal when it opens; return focus to chat input when it closes
      useEffect(() => {
        if (showAuthModal) {
          setTimeout(() => modalEmailRef.current?.focus(), 50);
        } else {
          setTimeout(() => inputRef.current?.focus(), 50);
        }
      }, [showAuthModal]);

      // URL param routing — allow skipping assessment via ?view=dashboard or ?view=sprint
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const view = params.get('view');
        if (view === 'dashboard' || view === 'sprint') {
          // Generate session ID if none exists
          if (!sessionId) {
            const newId = crypto.randomUUID();
            setSessionId(newId);
            localStorage.setItem('compadre_session_id', newId);
          }
          setSkippedAssessment(true);
          if (view === 'sprint') {
            setCurrentSprint(SPRINTS[0]);
            setSprintPhase('learn');
            setCurrentView('sprint');
          } else {
            setCurrentView('dashboard');
          }
          // Clean up URL params without reload
          window.history.replaceState({}, '', window.location.pathname);
        }
      }, []);

      // When assessment completes, generate session ID and switch to results
      useEffect(() => {
        if (assessmentResults && currentView === 'assessment') {
          const newSessionId = crypto.randomUUID();
          setSessionId(newSessionId);
          localStorage.setItem('compadre_session_id', newSessionId);
          setCurrentView('results');
        }
      }, [assessmentResults]);

      // =========================================================
      // Assessment Chat Logic (unchanged from Phase 1)
      // =========================================================
      const sendMessage = async () => {
        if (!input.trim() || isLoading) return;

        const userMessage = { role: 'user', content: input };
        setMessages(prev => [...prev, userMessage]);
        setInput('');
        setIsLoading(true);
        setError(null);

        try {
          const response = await fetch(`${API_URL}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              messages: [...messages.filter(m => m.role !== 'system'), userMessage].map(m => ({
                role: m.role,
                content: m.content
              })),
              consentGiven
            })
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || `Server error: ${response.status}`);
          }

          const data = await response.json();
          const assistantMessage = data.content[0].text;

          // Check if assessment is complete — extract JSON by brace-counting
          try {
            const marker = '"assessment_complete"';
            const markerIdx = assistantMessage.indexOf(marker);
            let extracted = null;
            let jsonStr = null;
            if (markerIdx !== -1) {
              let start = -1;
              for (let i = markerIdx - 1; i >= 0; i--) {
                if (assistantMessage[i] === '{') { start = i; break; }
              }
              if (start !== -1) {
                let depth = 0;
                for (let i = start; i < assistantMessage.length; i++) {
                  if (assistantMessage[i] === '{') depth++;
                  else if (assistantMessage[i] === '}') depth--;
                  if (depth === 0) {
                    jsonStr = assistantMessage.substring(start, i + 1);
                    const parsed = JSON.parse(jsonStr);
                    if (parsed.assessment_complete === true) extracted = parsed;
                    break;
                  }
                }
              }
            }
            if (extracted) {
              setAssessmentResults(extracted);
              const messageWithoutJson = assistantMessage.replace(jsonStr, '').trim();
              if (messageWithoutJson) {
                setMessages(prev => [...prev, { role: 'assistant', content: messageWithoutJson }]);
              }
            } else {
              setMessages(prev => [...prev, { role: 'assistant', content: assistantMessage }]);
            }
          } catch (e) {
            setMessages(prev => [...prev, { role: 'assistant', content: assistantMessage }]);
          }
        } catch (error) {
          console.error('Error:', error);
          setError(error.message);
          setMessages(prev => [...prev, {
            role: 'assistant',
            content: `Something went wrong on my end: ${error.message}. Try sending your message again — I'm still here.`
          }]);
        } finally {
          setIsLoading(false);
          setTimeout(() => inputRef.current?.focus(), 0);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      const handleSkip = () => {
        localStorage.setItem('compadre_skipped', 'true');
        setIsAnonymous(true);
        setShowAuthModal(false);
        // tutorial view is already showing underneath the modal — no trigger needed
      };

      // =========================================================
      // Auth Handlers
      // =========================================================
      const handleEmailSignIn = async () => {
        if (!supabase) return;
        setAuthError(null);
        setAuthLoading(true);
        const { error } = await supabase.auth.signInWithPassword({
          email: authEmail.trim(),
          password: authPassword
        });
        setAuthLoading(false);
        if (error) {
          setAuthError(error.message);
        }
        // On success, onAuthStateChange fires → sets user → closes modal automatically
      };

      const handleEmailSignUp = async () => {
        if (!supabase) return;
        setAuthError(null);
        setAuthLoading(true);
        const { error } = await supabase.auth.signUp({
          email: authEmail.trim(),
          password: authPassword
        });
        setAuthLoading(false);
        if (error) {
          setAuthError(error.message);
        } else {
          // Supabase sends a confirmation email by default.
          // Show a friendly message in place of an error.
          setAuthError('Check your email for a confirmation link, then sign in.');
        }
      };

      const handleGoogleSignIn = async () => {
        if (!supabase) return;
        setAuthError(null);
        setAuthLoading(true);
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.href }
        });
        // signInWithOAuth redirects the browser — loading stays true until redirect
        if (error) {
          setAuthLoading(false);
          setAuthError(error.message);
        }
      };

      const handleSignOut = async () => {
        if (!supabase) return;
        await supabase.auth.signOut();
        setUser(null);
        setIsAnonymous(false);
        localStorage.removeItem('compadre_skipped');
        setShowAuthModal(true);
      };

      // =========================================================
      // TEACHING MOMENT: Tutorial open/close flow
      // openTutorial() can be called from any view at any time.
      // It saves where the user was (tutorialReturnView) so we can
      // send them back there when they close the tutorial.
      // First-time flow: tutorialReturnView is null → go to assessment
      // and write the "done" flag. Refresher flow: tutorialReturnView
      // is set → go back to wherever they came from, skip the flag write.
      // =========================================================
      const openTutorial = () => {
        setTutorialReturnView(currentView);
        setTutorialStep(0);
        setCurrentView('tutorial');
      };

      const completeTutorial = () => {
        const returnTo = tutorialReturnView || 'assessment';
        // Only mark as done on the first-time completion, not on refresher views
        if (!tutorialReturnView) {
          localStorage.setItem('compadre_tutorial_done', 'true');
          if (supabase && user) {
            supabase.from('profiles')
              .update({ tutorial_completed: true })
              .eq('id', user.id)
              .then(({ error }) => {
                if (error) console.warn('[Tutorial] Failed to save completion:', error.message);
              });
          }
        }
        setTutorialReturnView(null);
        setTutorialStep(0);
        setCurrentView(returnTo);
      };

      const skipTutorial = () => {
        const returnTo = tutorialReturnView || 'assessment';
        // Only mark as done on the first-time skip, not on refresher views
        if (!tutorialReturnView) {
          localStorage.setItem('compadre_tutorial_done', 'true');
          if (supabase && user) {
            supabase.from('profiles')
              .update({ tutorial_completed: true })
              .eq('id', user.id)
              .then(({ error }) => {
                if (error) console.warn('[Tutorial] Failed to save skip:', error.message);
              });
          }
        }
        setTutorialReturnView(null);
        setTutorialStep(0);
        setCurrentView(returnTo);
      };

      const resetAssessment = () => {
        setMessages([{
          role: 'assistant',
          content: "Hey — I'm Compadre. I'll be with you every step of the way.\n\nBefore we jump into your first sprint, I want to figure out your best starting point. This isn't a test you can fail — it's just a conversation to understand where you are right now.\n\nReady to begin?"
        }]);
        setAssessmentResults(null);
        setError(null);
        setCurrentView('assessment');
      };

      // =========================================================
      // Submission Logic
      // =========================================================
      const handleSubmit = async () => {
        setSubmitError(null);

        if (memoText.length < 200) {
          setSubmitError('Your memo must be at least 200 characters.');
          return;
        }
        if (memoText.length > 5000) {
          setSubmitError('Your memo must be under 5000 characters.');
          return;
        }
        if (sheetsUrl) {
          try { new URL(sheetsUrl); } catch {
            setSubmitError('Please enter a valid URL for your Google Sheets link.');
            return;
          }
        }

        setIsSubmitting(true);

        try {
          // Step 1: Submit
          const submitRes = await fetch(`${API_URL}/api/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              session_id: sessionId,
              sprint_id: currentSprint.id,
              submission_text: memoText,
              google_sheets_url: sheetsUrl || undefined
            })
          });

          if (!submitRes.ok) {
            const err = await submitRes.json().catch(() => ({}));
            throw new Error(err.error || 'Submission failed');
          }

          const { submission_id } = await submitRes.json();

          // Step 2: Evaluate
          const evalRes = await fetch(`${API_URL}/api/evaluate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ submission_id })
          });

          if (!evalRes.ok) {
            const err = await evalRes.json().catch(() => ({}));
            throw new Error(err.error || 'Evaluation failed');
          }

          const feedback = await evalRes.json();
          setSubmissionFeedback(feedback);
          setCurrentView('feedback');
        } catch (error) {
          console.error('[Submit] Error:', error);
          setSubmitError(error.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      // =========================================================
      // Helper Functions
      // =========================================================
      const getColorClass = (color) => {
        switch(color) {
          case 'green': return 'bg-emerald-100 text-emerald-800 border-emerald-300';
          case 'yellow': return 'bg-yellow-100 text-yellow-800 border-yellow-300';
          case 'orange': return 'bg-orange-100 text-orange-800 border-orange-300';
          case 'red': return 'bg-red-100 text-red-800 border-red-300';
          default: return 'bg-gray-100 text-gray-800 border-gray-300';
        }
      };

      const getReadinessColor = (level) => {
        if (level <= 2) return 'text-emerald-600';
        if (level === 3) return 'text-yellow-600';
        if (level === 4) return 'text-orange-600';
        return 'text-red-600';
      };

      const getScoreColor = (score) => {
        if (score >= 75) return 'text-emerald-600';
        if (score >= 60) return 'text-yellow-600';
        return 'text-red-600';
      };

      const getScoreBg = (score) => {
        if (score >= 75) return 'bg-emerald-50 border-emerald-200';
        if (score >= 60) return 'bg-yellow-50 border-yellow-200';
        return 'bg-red-50 border-red-200';
      };

      // =========================================================
      // Header (shared across all views)
      // =========================================================
      const headerTitle = {
        assessment: 'Skills Check',
        results: 'Your Results',
        tutorial: 'Welcome to Compadre',
        dashboard: 'Sprint Dashboard',
        sprint: currentSprint ? `Sprint ${currentSprint.id}: ${currentSprint.title}` : 'Sprint',
        feedback: 'Feedback'
      };

      const headerSubtitle = {
        assessment: 'Find your starting sprint — about 10 minutes',
        results: 'Your personalized sprint plan',
        tutorial: 'A quick look at what\'s ahead — 2 minutes',
        dashboard: 'Choose your sprint',
        sprint: {
          learn:   'Learn the principle before you touch the data',
          choose:  'Pick your dataset and define your audience',
          build:   'Analyze in Excel, visualize in Tableau',
          publish: 'Share your work and add it to your portfolio',
        }[sprintPhase] || 'Complete the deliverables and submit your work',
        feedback: 'Here\'s what Compadre thinks of your work'
      };

      // =========================================================
      // RENDER
      // =========================================================
      return (
        <div className="min-h-screen flex flex-col" style={{
          background: 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)'
        }}>
          {/* ======================================================= */}
          {/* AUTH MODAL                                             */}
          {/* ======================================================= */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-4" role="presentation">
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="auth-modal-title"
                className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8"
              >

                {/* Header */}
                <div className="text-center mb-6">
                  <img src="compadre_pixel_centered.png" alt="Compadre" className="w-16 h-16 mx-auto mb-3 mix-blend-multiply" />
                  <h2 id="auth-modal-title" className="text-2xl font-bold text-gray-900" style={{ fontFamily: 'Georgia, serif' }}>
                    Welcome to Compadre
                  </h2>
                  <p className="text-gray-500 mt-2 text-sm leading-relaxed">
                    Save your progress and build a portfolio — or just dive in.
                  </p>
                </div>

                {/* Auth error / info message */}
                {authError && (
                  <div role="alert" aria-live="assertive" aria-atomic="true"
                    className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 mb-4 text-sm text-red-800">
                    {authError}
                  </div>
                )}

                {/* Google button */}
                <button
                  onClick={handleGoogleSignIn}
                  disabled={authLoading}
                  aria-busy={authLoading}
                  className="w-full flex items-center justify-center gap-3 px-4 py-3 border-2 border-gray-300 rounded-xl hover:border-gray-400 hover:bg-gray-50 transition-all font-medium text-gray-700 mb-4 disabled:opacity-50 disabled:cursor-not-allowed focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                >
                  <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                  </svg>
                  Continue with Google
                </button>

                {/* Divider */}
                <div className="flex items-center gap-3 mb-4">
                  <div className="flex-1 h-px bg-gray-200" />
                  <span className="text-xs text-gray-500 font-medium">or</span>
                  <div className="flex-1 h-px bg-gray-200" />
                </div>

                {/* Email + Password */}
                <div className="space-y-3 mb-4">
                  <div>
                    <label htmlFor="auth-email" className="block text-sm font-medium text-gray-700 mb-1">
                      Email
                    </label>
                    <input
                      ref={modalEmailRef}
                      id="auth-email"
                      type="email"
                      value={authEmail}
                      onChange={(e) => { setAuthEmail(e.target.value); setAuthError(null); }}
                      placeholder="you@example.com"
                      autoComplete="email"
                      aria-required="true"
                      className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                    />
                  </div>
                  <div>
                    <label htmlFor="auth-password" className="block text-sm font-medium text-gray-700 mb-1">
                      Password
                    </label>
                    <input
                      id="auth-password"
                      type="password"
                      value={authPassword}
                      onChange={(e) => { setAuthPassword(e.target.value); setAuthError(null); }}
                      onKeyDown={(e) => { if (e.key === 'Enter') handleEmailSignIn(); }}
                      placeholder="••••••••"
                      autoComplete="current-password"
                      aria-required="true"
                      className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                    />
                  </div>
                </div>

                {/* Sign In / Create Account */}
                <div className="flex gap-3 mb-6">
                  <button
                    onClick={handleEmailSignIn}
                    disabled={authLoading || !authEmail || !authPassword}
                    aria-busy={authLoading}
                    className="flex-1 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-semibold hover:from-purple-700 hover:to-indigo-700 transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                  >
                    {authLoading ? 'Signing in…' : 'Sign In'}
                  </button>
                  <button
                    onClick={handleEmailSignUp}
                    disabled={authLoading || !authEmail || !authPassword}
                    aria-busy={authLoading}
                    className="flex-1 py-3 border-2 border-purple-300 text-purple-700 rounded-xl font-semibold hover:border-purple-500 hover:bg-purple-50 transition-all disabled:opacity-50 disabled:cursor-not-allowed focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                  >
                    {authLoading ? 'Creating…' : 'Create Account'}
                  </button>
                </div>

                {/* Skip */}
                <div className="text-center">
                  <button
                    onClick={handleSkip}
                    className="text-gray-600 hover:text-gray-900 text-sm underline underline-offset-2 transition-colors focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 rounded"
                  >
                    Skip for now →
                    <span className="block text-xs text-gray-500 mt-0.5 no-underline">your progress won't be saved</span>
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Header */}
          <header className="bg-white shadow-sm border-b border-gray-200">
            <div className="max-w-4xl mx-auto px-4 py-4 flex items-center gap-3">
              <img src="compadre_pixel_centered.png" alt="Compadre" className="w-9 h-9 mix-blend-multiply flex-shrink-0" />
              <div className="flex-1">
                <h1 className="text-2xl font-bold text-gray-900" style={{ fontFamily: 'Georgia, serif' }}>
                  {headerTitle[currentView]}
                </h1>
                <p className="text-sm text-gray-700" aria-live="polite" aria-atomic="true">{headerSubtitle[currentView]}</p>
              </div>

              {/* How it works — persistent tutorial link, hidden while tutorial is open */}
              {currentView !== 'tutorial' && (
                <button
                  onClick={openTutorial}
                  className="text-sm text-gray-500 hover:text-gray-700 underline underline-offset-2 transition-colors focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 rounded flex-shrink-0 hidden sm:block"
                  aria-label="Open tutorial: how Compadre works"

                  How it works
                </button>
              )}

              {/* Auth indicator */}
              {user ? (
                <div className="flex items-center gap-3 flex-shrink-0">
                  <span className="text-sm text-gray-600 hidden sm:block" aria-label={`Signed in as ${user.email}`}>
                    {user.email}
                  </span>
                  <button
                    onClick={handleSignOut}
                    className="text-sm text-gray-500 hover:text-gray-800 underline underline-offset-2 transition-colors focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 rounded"
                  >
                    Sign out
                  </button>
                </div>
              ) : isAnonymous ? (
                <button
                  onClick={() => { setAuthError(null); setShowAuthModal(true); }}
                  className="text-sm text-purple-600 hover:text-purple-800 underline underline-offset-2 transition-colors focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 rounded flex-shrink-0"
                >
                  Save progress
                </button>
              ) : null}
            </div>
          </header>

          {/* Consent Banner — only during assessment */}
          {currentView === 'assessment' && (
            <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border-b border-blue-200 px-4 py-3">
              <div className="max-w-4xl mx-auto">
                <label htmlFor="consent-checkbox" className="flex items-start gap-3 cursor-pointer">
                  <input
                    id="consent-checkbox"
                    type="checkbox"
                    checked={consentGiven}
                    onChange={(e) => setConsentGiven(e.target.checked)}
                    aria-describedby="consent-description"
                    className="mt-1 w-5 h-5 text-purple-600 border-gray-300 rounded focus:ring-purple-500 focus:ring-offset-2 cursor-pointer"
                  />
                  <span className="text-sm text-gray-800">
                    <span className="font-medium">I consent to my anonymous assessment scores being used to improve Compadre.</span>
                    {' '}
                    <a href="privacy.html" target="_blank" rel="noopener noreferrer" className="text-purple-600 hover:text-purple-800 underline">Learn more</a>
                  </span>
                </label>
                <p id="consent-description" className="text-xs text-gray-600 mt-1 ml-8" aria-live="polite">
                  {consentGiven
                    ? "Your scores will help us identify common skill gaps and improve our curriculum."
                    : "You can still take the quiz - your results just won't be saved to our database."}
                </p>
              </div>
            </div>
          )}

          {/* Error Banner */}
          {error && (
            <div role="alert" aria-live="assertive" aria-atomic="true" className="bg-red-50 border-b border-red-200 px-4 py-3">
              <div className="max-w-4xl mx-auto flex items-center justify-between">
                <p className="text-sm text-red-800">{error}</p>
                <button onClick={() => setError(null)} className="text-red-600 hover:text-red-800 text-sm underline focus:ring-2 focus:ring-red-500 focus:ring-offset-2 rounded">Dismiss</button>
              </div>
            </div>
          )}

          {/* ======================================================= */}
          {/* VIEW: Assessment Chat */}
          {/* ======================================================= */}
          {currentView === 'assessment' && (
            <>
              <main id="main-content" className="flex-1 overflow-y-auto px-4 py-6" aria-label="Chat conversation">
                <ErrorBoundary name="Chat">
                  <div className="max-w-4xl mx-auto space-y-4" role="log" aria-live="polite" aria-relevant="additions">
                    {messages.map((message, idx) => (
                      <div key={idx} className={`flex ${message.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[80%] rounded-2xl px-6 py-4 shadow-md ${
                          message.role === 'user'
                            ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white'
                            : 'bg-white text-gray-800 border border-gray-200'
                        }`} aria-label={message.role === 'user' ? 'Your message' : 'AI tutor message'}>
                          <p className="whitespace-pre-wrap leading-relaxed" style={{ fontFamily: 'system-ui, -apple-system, sans-serif' }}>
                            {message.content}
                          </p>
                        </div>
                      </div>
                    ))}

                    {isLoading && (
                      <div className="flex justify-start">
                        <div className="bg-white rounded-2xl px-6 py-4 shadow-md border border-gray-200 flex items-center space-x-2">
                          <LoaderIcon />
                          <span className="text-gray-600">Thinking...</span>
                        </div>
                      </div>
                    )}

                    <div ref={messagesEndRef} />
                  </div>
                </ErrorBoundary>
              </main>

              <footer className="bg-white border-t border-gray-200 px-4 py-4">
                <div className="max-w-4xl mx-auto flex items-end space-x-3">
                  <label htmlFor="chat-input" className="sr-only">Type your response</label>
                  <textarea
                    ref={inputRef}
                    id="chat-input"
                    autoFocus
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    onKeyPress={handleKeyPress}
                    placeholder="Type your response..."
                    aria-label="Type your response"
                    disabled={isLoading}
                    rows="2"
                    className="flex-1 px-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:border-transparent resize-none disabled:bg-gray-100 disabled:cursor-not-allowed transition-all"
                    style={{ fontFamily: 'system-ui, -apple-system, sans-serif' }}
                  />
                  <button
                    onClick={sendMessage}
                    disabled={!input.trim() || isLoading}
                    aria-label="Send message"
                    className="px-6 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-semibold hover:from-purple-700 hover:to-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-lg hover:shadow-xl flex items-center space-x-2 focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                  >
                    <span>Send</span>
                    <SendIcon />
                  </button>
                </div>
              </footer>
            </>
          )}

          {/* ======================================================= */}
          {/* VIEW: Assessment Results */}
          {/* ======================================================= */}
          {currentView === 'results' && assessmentResults && (
            <ErrorBoundary name="Results Dashboard">
              <main id="main-content" className="flex-1 overflow-y-auto px-4 py-6">
                <div className="max-w-4xl mx-auto">
                  <div className="bg-gradient-to-r from-purple-50 to-indigo-50 rounded-2xl p-8 shadow-xl border border-purple-200">
                    <h2 className="text-3xl font-bold mb-2" style={{ fontFamily: 'Georgia, serif' }}>
                      Assessment Complete!
                    </h2>
                    <p className={`text-xl font-semibold mb-6 ${getReadinessColor(assessmentResults.readiness_level)}`}>
                      {assessmentResults.readiness_title}
                    </p>

                    {/* Overall Message */}
                    <div className="bg-white rounded-xl p-6 mb-6 shadow-md">
                      <p className="text-gray-700 leading-relaxed">{assessmentResults.overall_message}</p>
                    </div>

                    {/* Pillar Results */}
                    <div className="grid md:grid-cols-2 gap-4 mb-6">
                      {Object.entries(assessmentResults.pillars).map(([pillar, data]) => (
                        <div key={pillar} className="bg-white rounded-xl p-4 shadow-md border-l-4" style={{
                          borderColor: data.color === 'green' ? '#10b981' :
                                       data.color === 'yellow' ? '#f59e0b' :
                                       data.color === 'orange' ? '#f97316' : '#ef4444'
                        }}>
                          <div className="flex items-center justify-between mb-2">
                            <h3 className="font-semibold text-gray-900 capitalize">{pillar}</h3>
                            {data.color === 'green' ? <CheckCircleIcon /> : <CircleIcon />}
                          </div>
                          <div className={`inline-block px-3 py-1 rounded-full text-sm font-medium border ${getColorClass(data.color)}`}>
                            {data.level}
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Strengths */}
                    {assessmentResults.strengths && assessmentResults.strengths.length > 0 && (
                      <div className="bg-emerald-50 rounded-xl p-6 mb-4 border border-emerald-200">
                        <h3 className="font-bold text-emerald-900 mb-3 flex items-center">
                          <CheckCircleIcon />
                          <span className="ml-2">Your Strengths</span>
                        </h3>
                        <ul className="space-y-2">
                          {assessmentResults.strengths.map((strength, idx) => (
                            <li key={idx} className="text-emerald-800 flex items-start">
                              <span className="mr-2">+</span>
                              <span>{strength}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}

                    {/* Areas to Develop */}
                    {assessmentResults.areas_to_develop && assessmentResults.areas_to_develop.length > 0 && (
                      <div className="bg-blue-50 rounded-xl p-6 mb-4 border border-blue-200">
                        <h3 className="font-bold text-blue-900 mb-3">Areas to Develop</h3>
                        <ul className="space-y-2">
                          {assessmentResults.areas_to_develop.map((area, idx) => (
                            <li key={idx} className="text-blue-800 flex items-start">
                              <span className="mr-2">-</span>
                              <span>{area}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}

                    {/* Phase B: Data Skills Breakdown */}
                    {assessmentResults.phase_b && assessmentResults.phase_b.skills && (
                      <div className="bg-indigo-50 rounded-xl p-6 mb-4 border border-indigo-200">
                        <h3 className="font-bold text-indigo-900 mb-4">Data Skills Placement</h3>
                        <div className="grid md:grid-cols-2 gap-3">
                          {Object.entries(assessmentResults.phase_b.skills).map(([skill, info]) => {
                            const levelColors = {
                              'COMPETENT': 'bg-emerald-100 text-emerald-800 border-emerald-300',
                              'DEVELOPING': 'bg-yellow-100 text-yellow-800 border-yellow-300',
                              'BEGINNER': 'bg-orange-100 text-orange-800 border-orange-300',
                              'NONE': 'bg-red-100 text-red-800 border-red-300'
                            };
                            const colorClass = levelColors[info.level] || levelColors['NONE'];
                            const skillNames = {
                              excel: 'Excel / Sheets',
                              sql: 'SQL',
                              python: 'Python',
                              visualization: 'Data Visualization',
                              business_thinking: 'Business Thinking'
                            };
                            return (

                                <span className="font-medium text-gray-900">{skillNames[skill] || skill}</span>
                                <span className={`px-3 py-1 rounded-full text-xs font-semibold border ${colorClass}`}>{info.level}</span>

                          })}
                        </div>
                      </div>
                    )}

                    {/* Study Plan */}
                    {assessmentResults.phase_b && (
                      <div className="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl p-6 mb-4 border border-indigo-200">

                            <p className="text-sm text-gray-600 mt-1">Starting Point</p>
                          </div>
                          <div className="bg-white rounded-lg p-4 text-center shadow-sm">
                            <p className="text-3xl font-bold text-purple-600">{assessmentResults.phase_b.estimated_completion || '--'}</p>
                            <p className="text-sm text-gray-600 mt-1">Est. Completion</p>

                          <div className="bg-white rounded-lg p-4 text-center shadow-sm">

                      <p className="text-purple-800 mb-4">{assessmentResults.next_steps}</p>
                      <div className="flex items-center text-purple-700">
                        <span className="font-semibold">Estimated prep time:</span>
                        <span className="ml-2 bg-purple-100 px-3 py-1 rounded-full text-sm">
                          {assessmentResults.estimated_prep_time}
                        </span>
                      </div>
                    </div>

                    {/* Action Buttons */}
                    <div className="mt-6 flex flex-col sm:flex-row items-center justify-center gap-4">
