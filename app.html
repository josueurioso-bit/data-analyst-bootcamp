                                    <div>
                                      <p className="font-semibold text-gray-900 text-sm">{q}</p>
                                      <p className="text-gray-600 text-sm mt-0.5">{desc}</p>
                                    </div>
                                  </div>
                                ))}
                              </div>

                              <p className="text-gray-700 font-medium mb-3">
                                Quick — which of these is an <em>insight</em>, not just information?
                              </p>
                              {!learnPick3 ? (
                                <div className="space-y-2">
                                  {[
                                    { id: 'A', text: 'There are 127 Grade C restaurants in Queens.' },
                                    { id: 'B', text: 'Queens has the fastest-improving inspection scores of any borough — up 18% in two years.' },
                                    { id: 'C', text: 'The dataset covers inspections from 2019 to 2024.' },
                                  ].map(({ id, text }) => (
                                    <button
                                      key={id}
                                      onClick={() => setLearnPick3(id)}
                                      className="w-full flex items-start gap-3 px-4 py-3 rounded-xl border-2 border-gray-200 hover:border-indigo-400 hover:bg-indigo-50 transition-all text-left text-sm focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                                    >
                                      <span className="font-bold text-indigo-700 flex-shrink-0">{id}</span>
                                      <span className="text-gray-700">{text}</span>
                                    </button>
                                  ))}
                                </div>
                              ) : (
                                <div
                                  className={`rounded-xl p-4 border-2 text-sm ${learnPick3 === 'B' ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'}`}
                                  role="alert"
                                  aria-live="polite"
                                >
                                  <p className="font-semibold text-gray-900 mb-1">
                                    {learnPick3 === 'B' ? "✓ That's it." : 'Not quite — but here\'s the difference:'}
                                  </p>
                                  <p className="text-gray-700 leading-relaxed">
                                    {learnPick3 === 'A' && "A count is information — it describes what exists. Insight adds direction: where is this going, and what does it mean for a decision?"}
                                    {learnPick3 === 'B' && "Insight = information + direction + implication. The trend (up 18%) and the comparison (fastest of any borough) make this actionable."}
                                    {learnPick3 === 'C' && "That's metadata — it describes the dataset, not what the data shows. Insight lives in what the data reveals."}
                                  </p>
                                </div>
                              )}
                            </div>
                            {learnPick3 && (
                              <div className="px-8 py-4 bg-gray-50 border-t border-gray-200 flex justify-end">
                                <button
                                  onClick={() => setLearnCardIndex(3)}
                                  className="px-6 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-semibold hover:from-purple-700 hover:to-indigo-700 transition-all shadow-md focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                                >
                                  Next →
                                </button>
                              </div>
                            )}
                          </div>
                        )}

                        {/* ==============================================
                            CARD 4 — See It In Action
                            Sprint 1 scenario setup. No interaction —
                            narrative bridge to what they're about to do.
                            ============================================== */}
                        {learnCardIndex === 3 && (
                          <div className="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
                            <div className="px-8 py-6">
                              <span className="inline-block bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide mb-4">
                                Your Sprint
                              </span>
                              <h2 className="text-xl font-bold text-gray-900 mb-3" style={{ fontFamily: 'Georgia, serif' }}>
                                This is your Sprint 1 scenario.
                              </h2>
                              <p className="text-gray-700 leading-relaxed mb-4">
                                Your audience is the <strong>NYC Health Commissioner</strong>. She needs to allocate inspection resources for next year.
                              </p>
                              <p className="text-gray-700 leading-relaxed mb-4">
                                She doesn't need to know what columns are in your dataset. She needs to know:
                              </p>
                              <ul className="space-y-2 mb-5">
                                {[
                                  'Which boroughs are getting worse?',
                                  'Which cuisine types keep failing inspections?',
                                  'Is the overall trend improving or declining?',
                                ].map(q => (
                                  <li key={q} className="flex items-start gap-3">
                                    <span className="text-purple-600 font-bold flex-shrink-0 mt-0.5" aria-hidden="true">→</span>
                                    <span className="text-gray-700">{q}</span>
                                  </li>
                                ))}
                              </ul>
                              <div className="bg-purple-50 rounded-xl p-4 border border-purple-200">
                                <p className="text-sm text-purple-900 font-medium">
                                  Answer those three questions with your data and you've applied SWD Principle 1. The principle doesn't change — the dataset does.
                                </p>
                              </div>
                            </div>
                            <div className="px-8 py-4 bg-gray-50 border-t border-gray-200 flex justify-end">
                              <button
                                onClick={() => setLearnCardIndex(4)}
                                className="px-6 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-semibold hover:from-purple-700 hover:to-indigo-700 transition-all shadow-md focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                              >
                                Next →
                              </button>
                            </div>
                          </div>
                        )}

                        {/* ==============================================
                            CARD 5 — Quick Check
                            2 questions. Clickable, non-blocking.
                            Wrong = explanation + advance. No score shown.
                            Q2 only reveals after Q1 is answered.
                            "Continue to Choose →" appears when both done.
                            ============================================== */}
                        {learnCardIndex === 4 && (
                          <div className="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
                            <div className="px-8 py-6">
                              <span className="inline-block bg-yellow-100 text-yellow-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide mb-4">
                                Quick Check
                              </span>
                              <h2 className="text-xl font-bold text-gray-900 mb-6" style={{ fontFamily: 'Georgia, serif' }}>
                                Two quick ones before you move on.
                              </h2>

                              {/* Q1 */}
                              <div className="mb-6">
                                <p className="text-gray-700 font-medium mb-3">
                                  1. Before you open your dataset, your first question should be:
                                </p>
                                {!learnQC[0] ? (
                                  <div className="space-y-2">
                                    {[
                                      { id: 'A', text: 'What columns does it have?' },
                                      { id: 'B', text: 'What does my audience need to decide?' },
                                      { id: 'C', text: 'How many rows are there?' },
                                    ].map(({ id, text }) => (
                                      <button
                                        key={id}
                                        onClick={() => setLearnQC(prev => [id, prev[1]])}
                                        className="w-full flex items-start gap-3 px-4 py-3 rounded-xl border-2 border-gray-200 hover:border-yellow-400 hover:bg-yellow-50 transition-all text-left text-sm focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                                      >
                                        <span className="font-bold text-yellow-700 flex-shrink-0">{id}</span>
                                        <span className="text-gray-700">{text}</span>
                                      </button>
                                    ))}
                                  </div>
                                ) : (
                                  <div
                                    className={`rounded-xl p-3 border-2 text-sm ${learnQC[0] === 'B' ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'}`}
                                    role="alert"
                                    aria-live="polite"
                                  >
                                    <span className="font-semibold">{learnQC[0] === 'B' ? '✓' : '→'}</span>{' '}
                                    {learnQC[0] === 'B'
                                      ? 'Exactly. Audience questions come before data questions every time.'
                                      : 'The data question comes second. Start with: what does my audience need to decide?'}
                                  </div>
                                )}
                              </div>

                              {/* Q2 — only shows after Q1 is answered */}
                              {learnQC[0] && (
                                <div>
                                  <p className="text-gray-700 font-medium mb-3">
                                    2. Which of these is an insight, not just information?
                                  </p>
                                  {!learnQC[1] ? (
                                    <div className="space-y-2">
                                      {[
                                        { id: 'A', text: 'There are 127 Grade C restaurants in Queens.' },
                                        { id: 'B', text: 'The dataset has 26 columns and covers 5 years of inspections.' },
                                        { id: 'C', text: 'Queens has the fastest-improving inspection scores of any borough — up 18% in two years.' },
                                      ].map(({ id, text }) => (
                                        <button
                                          key={id}
                                          onClick={() => setLearnQC(prev => [prev[0], id])}
                                          className="w-full flex items-start gap-3 px-4 py-3 rounded-xl border-2 border-gray-200 hover:border-yellow-400 hover:bg-yellow-50 transition-all text-left text-sm focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                                        >
                                          <span className="font-bold text-yellow-700 flex-shrink-0">{id}</span>
                                          <span className="text-gray-700">{text}</span>
                                        </button>
                                      ))}
                                    </div>
                                  ) : (
                                    <div
                                      className={`rounded-xl p-3 border-2 text-sm ${learnQC[1] === 'C' ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'}`}
                                      role="alert"
                                      aria-live="polite"
                                    >
                                      <span className="font-semibold">{learnQC[1] === 'C' ? '✓' : '→'}</span>{' '}
                                      {learnQC[1] === 'A' && "That's information — a specific count. Insight adds direction and implication: where is this going, and what should we do about it?"}
                                      {learnQC[1] === 'B' && "That's metadata — it describes the dataset, not what the data shows. Insight lives in what the data reveals."}
                                      {learnQC[1] === 'C' && "A finding plus direction plus scale — that's insight. You'll build this kind of statement in your memo."}
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>

                            {/* Continue button — only after both questions answered */}
                            {learnQC[0] && learnQC[1] && (
                              <div className="px-8 py-4 bg-gray-50 border-t border-gray-200 flex justify-end">
                                <button
                                  onClick={() => setSprintPhase('choose')}
                                  className="px-6 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-xl font-semibold hover:from-emerald-600 hover:to-teal-600 transition-all shadow-md focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
                                >
                                  Continue to Choose →
                                </button>
                              </div>
                            )}
                          </div>
                        )}

                      </div>
                    ) : (
                      /* ── Generic placeholder for non-Sprint-1 sprints ── */
                      <div>
                        <div className="bg-white rounded-xl p-8 shadow-md border border-gray-200 mb-6">
                          <div className="flex items-center gap-2 mb-4">
                            <span className="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">Learn</span>
                            <span className="text-sm text-gray-500">Sprint {currentSprint.id} · SWD Principle {currentSprint.id}</span>
                          </div>
                          <h2 className="text-2xl font-bold text-gray-900 mb-2" style={{ fontFamily: 'Georgia, serif' }}>
                            {currentSprint.title}
                          </h2>
                          <p className="text-gray-600 leading-relaxed">Lesson content coming soon.</p>
                        </div>
                        <div className="flex justify-end">
                          <button
                            onClick={() => setSprintPhase('choose')}
                            className="px-6 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-semibold hover:from-purple-700 hover:to-indigo-700 transition-all shadow-md focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                          >
                            Continue to Choose →
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* =========================================================
                    PHASE: CHOOSE
                    Placeholder — dataset picker UI added in Task 2.6
                    ========================================================= */}
                {sprintPhase === 'choose' && (
                  <div>
                    <div className="bg-white rounded-xl p-8 shadow-md border border-gray-200 mb-6">
                      <div className="flex items-center gap-2 mb-4">
                        <span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">Choose</span>
                        <span className="text-sm text-gray-500">Pick your dataset and define your audience</span>
                      </div>
                      <h2 className="text-2xl font-bold text-gray-900 mb-2" style={{ fontFamily: 'Georgia, serif' }}>
                        Choose Your Data
                      </h2>
                      <p className="text-gray-600 leading-relaxed">
                        Dataset picker and audience definition fields load here in Task 2.6.
                      </p>
                    </div>
                    <div className="flex justify-end">
                      <button
                        onClick={() => setSprintPhase('build')}
                        className="px-6 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-semibold hover:from-purple-700 hover:to-indigo-700 transition-all shadow-md focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                      >
                        Start Building →
                      </button>
                    </div>
                  </div>
                )}

                {/* =========================================================
                    PHASE: BUILD
                    Existing workspace — unchanged from Phase 2 build.
                    ========================================================= */}
                {sprintPhase === 'build' && (
                  <div>
                    {/* Business Scenario */}
                    <div className="bg-white rounded-xl p-6 shadow-md border border-gray-200 mb-6">
                      <h2 className="text-xl font-bold text-gray-900 mb-4" style={{ fontFamily: 'Georgia, serif' }}>
                        Business Scenario
                      </h2>
                      <p className="text-gray-700 leading-relaxed whitespace-pre-line">
                        {currentSprint.business_scenario}
                      </p>
                    </div>

                    {/* Dataset Download */}
                    {currentSprint.dataset_url && (
                      <div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-6 shadow-md border border-blue-200 mb-6">
                        <div className="flex items-center justify-between">
                          <div>
                            <h3 className="font-bold text-blue-900 mb-1">Dataset</h3>
                            <p className="text-sm text-blue-700">5,000 delivery records (CSV format)</p>
                          </div>
                          <a
                            href={currentSprint.dataset_url}
                            download
                            className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-md focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                          >
                            <DownloadIcon />
                            Download CSV
                          </a>
                        </div>
                      </div>
                    )}

                    {/* Deliverables Checklist */}
                    <div className="bg-white rounded-xl p-6 shadow-md border border-gray-200 mb-6">
                      <h3 className="font-bold text-gray-900 mb-4">Deliverables Checklist</h3>
                      <ul className="space-y-3">
                        {currentSprint.deliverables.map((item, idx) => (
                          <li key={idx} className="flex items-start gap-3">
                            <span className="mt-0.5 w-5 h-5 rounded border-2 border-gray-300 flex-shrink-0 flex items-center justify-center text-xs text-gray-600">
                              {idx + 1}
                            </span>
                            <span className="text-gray-700">{item}</span>
                          </li>
                        ))}
                      </ul>
                    </div>

                    {/* Submission Form */}
                    <div className="bg-white rounded-xl p-6 shadow-md border-2 border-purple-200">
                      <h3 className="font-bold text-gray-900 mb-4" style={{ fontFamily: 'Georgia, serif' }}>
                        Submit Your Work
                      </h3>

                      {/* Google Sheets URL */}
                      <div className="mb-4">
                        <label htmlFor="sheets-url" className="block text-sm font-medium text-gray-700 mb-1">
                          Google Sheets Link (optional)
                        </label>
                        <input
                          id="sheets-url"
                          type="url"
                          value={sheetsUrl}
                          onChange={(e) => setSheetsUrl(e.target.value)}
                          placeholder="https://docs.google.com/spreadsheets/d/..."
                          className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                        />
                        <p className="text-xs text-gray-500 mt-1">Saved for reference only — the AI evaluates your memo text below.</p>
                      </div>

                      {/* Executive Memo */}
                      <div className="mb-4">
                        <label htmlFor="memo-text" className="block text-sm font-medium text-gray-700 mb-1">
                          Executive Memo
                        </label>
                        <textarea
                          id="memo-text"
                          value={memoText}
                          onChange={(e) => setMemoText(e.target.value)}
                          placeholder="Write your executive memo to the VP of Operations here. Describe your findings, the root causes you identified, and your recommendations..."
                          rows="10"
                          maxLength={5000}
                          className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-y transition-all"
                          style={{ fontFamily: 'system-ui, -apple-system, sans-serif' }}
                        />
                        <div className="flex justify-between items-center mt-1">
                          <p className={`text-xs ${memoText.length < 200 ? 'text-red-500' : memoText.length > 4500 ? 'text-yellow-600' : 'text-gray-500'}`}>
                            {memoText.length < 200 ? `${200 - memoText.length} more characters needed` : `${memoText.length}/5000 characters`}
                          </p>
                          <p className="text-xs text-gray-600">Min 200, Max 5000</p>
                        </div>
                      </div>

                      {/* Submit Error */}
                      {submitError && (
                        <div role="alert" aria-live="assertive" aria-atomic="true" className="bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
                          <p className="text-sm text-red-800">{submitError}</p>
                        </div>
                      )}

                      {/* Submit Button */}
                      <button
                        onClick={handleSubmit}
                        disabled={isSubmitting || memoText.length < 200}
                        aria-busy={isSubmitting}
                        className="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2 focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                      >
                        {isSubmitting ? (
                          <>
                            <LoaderIcon />
                            <span>Compadre is reviewing your work...</span>
                          </>
                        ) : (
                          <span>Submit for Evaluation</span>
                        )}
                      </button>
                    </div>
                  </div>
                )}

                {/* =========================================================
                    PHASE: PUBLISH
                    Placeholder — Tableau URL submission added in Task 3.2
                    ========================================================= */}
                {sprintPhase === 'publish' && (
                  <div className="bg-white rounded-xl p-8 shadow-md border border-gray-200">
                    <div className="flex items-center gap-2 mb-4">
                      <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">Publish</span>
                      <span className="text-sm text-gray-500">Share your work</span>
                    </div>
                    <h2 className="text-2xl font-bold text-gray-900 mb-2" style={{ fontFamily: 'Georgia, serif' }}>
                      Publish Your Work
                    </h2>
                    <p className="text-gray-600 leading-relaxed">
                      Tableau Public URL submission and portfolio save coming in Task 3.2.
                    </p>
                  </div>
                )}

              </div>
            </main>
          )}

          {/* ======================================================= */}
          {/* VIEW: Feedback Display */}
          {/* ======================================================= */}
          {currentView === 'feedback' && submissionFeedback && (
            <ErrorBoundary name="Feedback">
              <main id="main-content" className="flex-1 overflow-y-auto px-4 py-6">
                <div className="max-w-4xl mx-auto">

                  {/* Overall Score */}
                  <div className={`rounded-2xl p-8 shadow-xl border-2 mb-6 text-center ${getScoreBg(submissionFeedback.overall_score)}`}>
                    <p className={`text-6xl font-bold mb-2 ${getScoreColor(submissionFeedback.overall_score)}`}>
                      {submissionFeedback.overall_score}
                    </p>
                    <p className="text-lg font-semibold text-gray-700 mb-2">Overall Score</p>
                    <p className={`text-xl font-bold ${submissionFeedback.passed ? 'text-emerald-600' : 'text-red-600'}`}>
                      {submissionFeedback.passed ? 'PASSED' : 'NOT YET — Keep Going!'}
                    </p>
                    {submissionFeedback.overall_feedback && (
                      <p className="text-gray-700 mt-4 max-w-2xl mx-auto leading-relaxed">{submissionFeedback.overall_feedback}</p>
                    )}
                  </div>

                  {/* Category Scores */}
                  <div className="grid md:grid-cols-2 gap-4 mb-6">
                    {submissionFeedback.category_scores && Object.entries(submissionFeedback.category_scores).map(([category, data]) => (
                      <div key={category} className="bg-white rounded-xl p-5 shadow-md border border-gray-200">
                        <div className="flex items-center justify-between mb-3">
                          <h3 className="font-bold text-gray-900">{category}</h3>
                          <span className={`text-2xl font-bold ${getScoreColor(data.score)}`}>{data.score}</span>
                        </div>
                        <p className="text-sm text-gray-600 leading-relaxed">{data.feedback}</p>
                      </div>
                    ))}
                  </div>

                  {/* Strengths */}
                  {submissionFeedback.strengths && submissionFeedback.strengths.length > 0 && (
                    <div className="bg-emerald-50 rounded-xl p-6 mb-4 border border-emerald-200">
                      <h3 className="font-bold text-emerald-900 mb-3 flex items-center">
                        <CheckCircleIcon />
                        <span className="ml-2">Strengths</span>
                      </h3>
                      <ul className="space-y-2">
                        {submissionFeedback.strengths.map((s, idx) => (
                          <li key={idx} className="text-emerald-800 flex items-start">
                            <span className="mr-2">+</span>
                            <span>{s}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Areas for Improvement */}
                  {submissionFeedback.areas_for_improvement && submissionFeedback.areas_for_improvement.length > 0 && (
                    <div className="bg-blue-50 rounded-xl p-6 mb-4 border border-blue-200">
                      <h3 className="font-bold text-blue-900 mb-3">Areas for Improvement</h3>
                      <ul className="space-y-2">
                        {submissionFeedback.areas_for_improvement.map((a, idx) => (
                          <li key={idx} className="text-blue-800 flex items-start">
                            <span className="mr-2">-</span>
                            <span>{a}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Next Steps */}
                  {submissionFeedback.next_steps && (
                    <div className="bg-purple-50 rounded-xl p-6 mb-6 border border-purple-200">
                      <h3 className="font-bold text-purple-900 mb-3">Next Steps</h3>
                      <p className="text-purple-800">{submissionFeedback.next_steps}</p>
                    </div>
                  )}

                  {/* Action Buttons */}
                  <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                    {!submissionFeedback.passed && (
                      <button
                        onClick={() => {
                          setSubmissionFeedback(null);
                          setSubmitError(null);
                          setCurrentView('sprint');
                        }}
                        className="px-6 py-3 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-lg font-semibold hover:from-orange-600 hover:to-red-600 transition-all shadow-lg hover:shadow-xl focus:ring-2 focus:ring-orange-500 focus:ring-offset-2"
                      >
                        Try Again
                      </button>
                    )}
                    <button
                      onClick={() => setCurrentView('dashboard')}
                      className="px-6 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 transition-all shadow-lg hover:shadow-xl focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
                    >
                      Back to Dashboard
                    </button>
                  </div>
                </div>
              </main>
            </ErrorBoundary>
          )}
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
